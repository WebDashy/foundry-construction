<header class="site-header" id="top">
  <div class="wrap header-inner">
    <a class="logo" href="{{ '/' | relative_url }}">
      <span class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="3" width="18" height="18" fill="currentColor"/></svg>
      </span>
      Foundry<span class="logo-thin">Construction Group</span>
    </a>

    <nav class="main-nav" id="main-nav">
      <a href="{{ '/services/' | relative_url }}">Services</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>

    <div class="header-actions">
      <a class="phone-link" href="tel:{{ site.business.phone }}">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6.6 10.8c1.4 2.8 3.8 5.2 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9.4 0-17-7.6-17-17 0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1l-2.2 2.2z" fill="currentColor"/></svg>
        {{ site.business.phone_display }}
      </a>
      <a class="btn btn-primary" href="{{ '/contact/' | relative_url }}">Request a Bid</a>
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="main-nav" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
